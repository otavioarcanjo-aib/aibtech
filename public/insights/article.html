<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicação | aiBox</title><meta name="description" content="Leitura de pesquisa do aiBox, laboratório de pesquisa aplicada em inteligência artificial do aiB."><link rel="icon" href="/brand/bee-night.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/insights/insights.css"><link rel="stylesheet" href="/insights/site-shell.css"></head><body><header class="topbar"><div class="wrap header-inner"><a href="/" aria-label="aiB início"><img class="logo" src="/brand/logo-night.png" width="110" height="45" alt="aiB"></a><button class="menu-toggle" aria-expanded="false" aria-controls="navigation">Menu <span aria-hidden="true">☰</span></button><nav class="nav" id="navigation" aria-label="Navegação principal"><a href="/solucoes">Soluções</a><a href="/#sobre">Sobre o aiB</a><a href="/insights" aria-current="page">Insights</a><a href="/#contato" class="button">Vamos conversar <span class="arrow" aria-hidden="true">↗</span></a></nav></div></header><main id="article-root"></main><footer class="footer"><div class="wrap footer-inner"><span>© 2026 AIB Technology Solutions.</span><a href="/insights">Todos os Insights →</a></div></footer><script src="/insights/publications.js"></script><script>
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const slug=location.pathname.split('/').filter(Boolean).pop();const item=window.AIB_PUBLICATIONS.find(e=>e.slug===slug);const root=document.getElementById('article-root');if(!item){document.title='Publicação não encontrada | aiBox';root.innerHTML='<section class="article-hero"><div class="wrap"><h1>Publicação não encontrada.</h1><p class="article-lead"><a href="/insights">Voltar para Insights</a></p></div></section>'}else{document.title=`${item.title} | aiBox`;document.querySelector('meta[name="description"]').setAttribute('content',item.summary);root.innerHTML=`<section class="article-hero"><div class="wrap"><a class="back-link" href="/insights">← Voltar para Insights</a><div class="article-hero-grid"><div class="meta"><span class="language">${esc(item.language)}</span><time>${esc(item.date)}</time><span>${esc(item.venue)}</span></div><div><h1>${esc(item.title)}</h1><p class="article-lead">${esc(item.summary)}</p></div></div></div></section><div class="wrap article-layout"><aside class="article-aside"><p class="article-aside-label">Pesquisa original</p><a href="${esc(item.source)}" target="_blank" rel="noopener">Acessar publicação ↗</a></aside><article class="article-body"><section><h2>Contexto da pesquisa</h2><p>${esc(item.context)}</p></section><section><h2>A abordagem</h2><p>${esc(item.approach)}</p></section><section class="result-box"><h2>Principais resultados</h2><p>${esc(item.results)}</p></section><section><h2>Por que isso importa</h2><p>${esc(item.importance)}</p></section><section><h2>Limitações</h2><p>${esc(item.limitations)}</p></section><div class="article-facts"><div class="fact"><span>Título original</span><strong>${esc(item.originalTitle)}</strong></div><div class="fact"><span>Autores</span><strong>${esc(item.authors)}</strong></div><div class="fact"><span>Data</span><strong>${esc(item.date)}</strong></div><div class="fact"><span>Idioma</span><strong>${esc(item.language)}</strong></div></div></article></div><section class="cta"><div class="wrap cta-inner"><h2>Quer aplicar esse conhecimento no seu contexto?</h2><a class="button" href="/#contato">Vamos conversar →</a></div></section>`}
</script><script src="/insights/site-shell.js"></script></body></html>
